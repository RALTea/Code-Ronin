services:
  coderonin:
    image: rotour/coderonin
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    ports:
      - '5174:3000'

  coderonin-db:
    image: postgres:16.2
    environment:
      POSTGRES_USER: coderonin
      POSTGRES_PASSWORD: coderonin
      POSTGRES_DB: coderonin
    ports:
      - '5433:5432'
    volumes:
      - coderonin-db-data:/var/lib/postgresql/data

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

  judge_server:
    image: rotour/judge0-workers:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./active.rb:/api/db/languages/active.rb:ro
      - ./Code-Ronin/infra/judge-custom/base64_service.rb:/api/app/services/base64_service.rb:ro
    ports:
      - '2358:2358'
    privileged: true
    <<: *default-logging
    restart: always
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.judge.rule=Host(`judge.raltech.school`)'
      - 'traefik.http.routers.judge.entrypoints=https'
      - 'traefik.http.routers.judge.tls.certresolver=letsencrypt'
      - 'traefik.http.services.judge.loadbalancer.server.port=2358'
      # HTTP to HTTPS redirect
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https'
      - 'traefik.http.routers.judge-http.entrypoints=http'
      - 'traefik.http.routers.judge-http.rule=Host(`judge.raltech.school`)'
      - 'traefik.http.routers.judge-http.middlewares=redirect-to-https'
    networks:
      - default

  judge_workers:
    image: rotour/judge0-workers:1.13.1
    build:
      context: .
      dockerfile: Dockerfile
    command: ['./scripts/workers']
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./active.rb:/api/db/languages/active.rb:ro
    privileged: true
    <<: *default-logging
    restart: always
    networks:
      - default

  # db:
  #   image: postgres:16.2
  #   env_file: judge0.conf
  #   volumes:
  #     - data:/var/lib/postgresql/data/
  #   <<: *default-logging
  #   restart: always
  #   networks:
  #     - default

  redis:
    image: redis:7.2.4
    command: ['bash', '-c', 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    <<: *default-logging
    restart: always
    networks:
      - default

volumes:
  judge_data:
  coderonin-db-data:
    driver: local
