x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    container_name: judge_server
    image: rotour/judge0-workers:1.13.1
    build:
      context: .
      dockerfile: Dockerfile
    env_file: judge0.conf
    # volumes:
    # - ./judge0.conf:/judge0.conf:ro
    # - ./active.rb:/api/db/languages/active.rb:ro
    # - ./judge-custom/base64_service.rb:/api/app/services/base64_service.rb:ro
    ports:
      - '2358:2358'
    privileged: true
    <<: *default-logging
    restart: no

  workers:
    container_name: judge_workers
    image: rotour/judge0-workers:1.13.1
    build:
      context: .
      dockerfile: Dockerfile
    command: ['./scripts/workers']
    env_file: judge0.conf
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./active.rb:/api/db/languages/active.rb:ro
    privileged: true
    <<: *default-logging
    restart: no

  db:
    container_name: judge_db
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  judge0-redis:
    container_name: judge_redis
    image: redis:7.2.4
    command: ['bash', '-c', 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    <<: *default-logging
    restart: always

volumes:
  data:
